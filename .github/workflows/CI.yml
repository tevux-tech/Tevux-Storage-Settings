name: CI

on:
  push:
    tags:
      - "Versions/*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Read project version
        id: get_version
        uses: greenygh0st/net-proj-release-version@v2
        with:
          PROJ_FILE: TevuxTech.Storage.Settings/TevuxTech.Storage.Settings.csproj

      - name: Set project version
        run: echo "PROJECT_VERSION=${{steps.get_version.outputs.RELEASE_VERSION}}" >> $GITHUB_ENV

      - name: Set tag version
        run: echo "TAG_VERSION=${GITHUB_REF#refs/tags/Versions/}" >> $GITHUB_ENV

#      - name: Compare project and tag version
#        run : |
#          if [ "${{env.PROJECT_VERSION}}" != "${{env.TAG_VERSION}}" ]; then
#            echo "Project version ${{env.PROJECT_VERSION}} doesn't match tag version ${{env.TAG_VERSION}}!"
#            exit 1
#          fi

      - name: Setup dotnet
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '8.0.x' # SDK Version to use.
          source-url: https://nuget.pkg.github.com/tevux-tech/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Build
        run: dotnet build --configuration Release TevuxTech.Storage.Settings

      - name: Publish the package to GPR
        run: dotnet nuget push TevuxTech.Storage.Settings/bin/Release/*.nupkg